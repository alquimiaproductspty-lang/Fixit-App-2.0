    <!-- Títulos y Descripciones (Lo que lee Google en sus resultados) -->
    <title>FIXIT Panamá | Plomería, Electricidad y Reparaciones a Domicilio</title>

    <meta name="author" content="FIXIT Panamá" />
    
    <!-- Etiqueta Canonical (Define tu nuevo dominio oficial) -->
    <link rel="canonical" href="https://www.fixitpanama.com" />

    <!-- SEO Local (Para dominar en búsquedas de "servicios cerca de mí") -->
    <meta name="geo.region" content="PA-8" />

    <meta name="geo.position" content="8.9824;-79.5199" />
    <meta name="ICBM" content="8.9824, -79.5199" />

    <!-- Open Graph (Cómo se verá tu link al mandarlo por WhatsApp o Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fixitpanama.com/" />
    <meta property="og:title" content="FIXIT Panamá | Servicios y Reparaciones para tu Hogar" />

    <meta property="og:site_name" content="FIXIT" />
    <meta property="og:locale" content="es_PA" />

    <!-- Datos Estructurados JSON-LD (El "Cerebro" de Google Search) -->

      "@context": "https://schema.org",
      "@type": "HomeAndConstructionBusiness",
      "name": "FIXIT Panamá",

      "url": "https://www.fixitpanama.com",
      "telephone": "+507", 
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Ciudad de Panamá",
        "addressLocality": "Panamá",
        "addressRegion": "PA",
        "addressCountry": "PA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 8.9824,
        "longitude": -79.5199
      },
      "areaServed": {
        "@type": "City",
        "name": "Panama City"
      },
      "description": "Servicios residenciales premium de plomería, electricidad y reparaciones generales en Ciudad de Panamá. Reserva y cotiza en línea al instante.",
      "priceRange": "$$",
      "sameAs": [
        "https://www.fixitpanama.com"
      ]
